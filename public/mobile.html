<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0d0d0d" />
    <title>载具资料库 · 请使用 PC 端访问</title>
    <style>
      :root {
        color-scheme: dark;
        font-family:
          "Microsoft YaHei UI", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif;
        background: #0d0d0d;
        color: #f3f2e8;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-width: 280px;
        min-height: 100%;
        margin: 0;
      }

      body {
        min-height: 100svh;
        overflow: hidden;
        background:
          radial-gradient(circle at 50% 38%, rgba(225, 173, 79, 0.11), transparent 38%),
          linear-gradient(rgba(255, 255, 255, 0.018) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.018) 1px, transparent 1px),
          #0d0d0d;
        background-size: auto, 32px 32px, 32px 32px, auto;
      }

      body::before,
      body::after {
        position: fixed;
        content: "";
        pointer-events: none;
      }

      body::before {
        inset: 0;
        border: 1px solid rgba(225, 200, 155, 0.08);
      }

      body::after {
        right: -90px;
        bottom: -130px;
        width: 280px;
        height: 280px;
        border: 1px solid rgba(225, 173, 79, 0.13);
        border-radius: 50%;
        box-shadow:
          0 0 0 40px rgba(225, 173, 79, 0.025),
          0 0 0 88px rgba(225, 173, 79, 0.015);
      }

      main {
        display: grid;
        min-height: 100svh;
        place-items: center;
        padding:
          max(32px, env(safe-area-inset-top))
          max(24px, env(safe-area-inset-right))
          max(32px, env(safe-area-inset-bottom))
          max(24px, env(safe-area-inset-left));
      }

      .panel {
        width: min(100%, 440px);
      }

      .brand {
        display: flex;
        gap: 10px;
        align-items: center;
        margin-bottom: clamp(42px, 8vh, 70px);
        color: #a9a99f;
        font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
        font-size: 11px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      .brand-mark {
        display: inline-grid;
        width: 28px;
        height: 28px;
        border: 1px solid rgba(225, 200, 155, 0.58);
        place-items: center;
        color: #e1c89b;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0;
      }

      .device {
        position: relative;
        display: grid;
        width: 88px;
        height: 88px;
        margin-bottom: 30px;
        border: 1px solid rgba(225, 173, 79, 0.28);
        background: rgba(225, 173, 79, 0.035);
        place-items: center;
      }

      .device::before,
      .device::after {
        position: absolute;
        content: "";
        background: #e1ad4f;
        box-shadow: 0 0 14px rgba(225, 173, 79, 0.72);
      }

      .device::before {
        top: -1px;
        left: -1px;
        width: 24px;
        height: 1px;
      }

      .device::after {
        top: -1px;
        left: -1px;
        width: 1px;
        height: 24px;
      }

      .device svg {
        width: 48px;
        height: 48px;
        color: #e7d4ad;
      }

      .eyebrow {
        margin: 0 0 12px;
        color: #e1ad4f;
        font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
        font-size: 11px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      h1 {
        max-width: 12em;
        margin: 0;
        font-size: clamp(29px, 8vw, 40px);
        font-weight: 680;
        letter-spacing: -0.045em;
        line-height: 1.18;
      }

      .rule {
        width: 56px;
        height: 2px;
        margin: 24px 0;
        background: #e1ad4f;
        box-shadow: 0 0 18px rgba(225, 173, 79, 0.48);
      }

      .message {
        max-width: 29em;
        margin: 0;
        color: #b4b5ae;
        font-size: 15px;
        line-height: 1.85;
      }

      .address {
        display: flex;
        gap: 10px;
        align-items: center;
        margin: 34px 0 0;
        color: #d7d1c0;
        font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
        font-size: 12px;
        letter-spacing: 0.02em;
      }

      .address::before {
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: #82b88d;
        box-shadow: 0 0 10px rgba(130, 184, 141, 0.64);
        content: "";
        flex: 0 0 auto;
      }

      .footnote {
        margin: clamp(48px, 9vh, 76px) 0 0;
        color: #686b67;
        font-size: 11px;
        line-height: 1.6;
      }

      @media (max-height: 660px) {
        body {
          overflow: auto;
        }

        .brand {
          margin-bottom: 28px;
        }

        .device {
          width: 72px;
          height: 72px;
          margin-bottom: 22px;
        }

        .device svg {
          width: 40px;
          height: 40px;
        }

        .footnote {
          margin-top: 32px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="panel" aria-labelledby="mobile-title">
        <div class="brand"><span class="brand-mark">S</span><span>Sigua Armor Database</span></div>
        <div class="device" aria-hidden="true">
          <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.5">
            <rect x="5.5" y="8.5" width="37" height="25" rx="1.5" />
            <path d="M18 39.5h12M24 33.5v6" />
            <path d="M10 13.5h28v15H10z" opacity=".34" />
          </svg>
        </div>
        <p class="eyebrow">Desktop experience</p>
        <h1 id="mobile-title">请使用 PC 端访问</h1>
        <div class="rule" aria-hidden="true"></div>
        <p class="message">
          当前版本包含高精度 3D 模型、装甲分析与桌面级交互。为保证画面质量和操作体验，移动端暂不开放，请在电脑浏览器中访问。
        </p>
        <p class="address">siguad.icu</p>
        <p class="footnote">感谢理解。后续移动端适配完成后，将开放访问。</p>
      </section>
    </main>
  </body>
</html>
