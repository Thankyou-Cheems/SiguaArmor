name: sigua-armor-public

services:
  sigua-public:
    container_name: sigua-public
    image: caddy:2@sha256:ec18ee54aab3315c22e25f3b2babda73ff8007d39b13b3bd1bfffa2f0444c7d9
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./release:/srv/public:ro
      - ./data/content:/srv/content:ro
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    networks:
      - homelab-web
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /config
      - /data
    expose:
      - "8080"
    depends_on:
      sigua-content-admin:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --header=\"X-Sigua-Origin-Auth: $${SIGUA_ORIGIN_AUTH_SECRET}\" -O /dev/null http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  sigua-content-admin:
    container_name: sigua-content-admin
    image: mirror.ccs.tencentyun.com/library/node:24.21.0-alpine@sha256:ebfe2f90462722a7a4de65e91990e97fe0d401c70e0e762c5b53302f905ec1c1
    restart: unless-stopped
    stop_grace_period: 15s
    env_file:
      - .env
    environment:
      NODE_ENV: production
      SIGUA_PUBLIC_ORIGIN: {{ARMOR_ORIGIN}}
      SIGUA_WIKI_ORIGIN: {{WIKI_ORIGIN}}
      SIGUA_CONTENT_ROOT: /srv/content
      SIGUA_WIKI_ROOT: /srv/wiki
      SIGUA_CONTENT_ADMIN_LISTEN_HOST: 0.0.0.0
      SIGUA_CONTENT_ADMIN_PORT: "8083"
      SIGUA_CONTENT_ADMIN_SESSION_TTL_SECONDS: "900"
      SIGUA_ANALYTICS_ADMIN_URL: http://sigua-analytics:8081/__analytics/admin/overview
    command: ["node", "/app/server.mjs"]
    volumes:
      - ./services/content-admin:/app:ro
      - ./data/content:/srv/content
      - ${SIGUA_WIKI_VEHICLE_DATA_ROOT:-/opt/Website/sigua-wiki/data/vehicles}:/srv/wiki/data/vehicles
    working_dir: /app
    networks:
      - homelab-web
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    user: "1000:1000"
    expose:
      - "8083"
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "3", "-O", "/dev/null", "http://127.0.0.1:8083/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

networks:
  homelab-web:
    external: true
    name: homelab_web
