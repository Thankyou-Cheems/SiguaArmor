<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Coordinate boundary fixture</title><style>body{font:15px system-ui;background:#18222d;color:#e7edf2;padding:24px}canvas{border:1px solid #789}pre{white-space:pre-wrap}</style></head>
<body><h1>Coordinate boundary fixture</h1><p>Synthetic consumer and framebuffer parity; full product asset/pixel acceptance remains separate.</p><pre id="results">pending</pre>
<script>window.coordinateErrors=[];window.addEventListener('error',e=>window.coordinateErrors.push(e.message));window.addEventListener('unhandledrejection',e=>window.coordinateErrors.push(String(e.reason)));</script>
<script type="module">
import * as THREE from 'three';
import snapshot from '/tests/fixtures/coordinate-boundary-before-refactor.json';
import {captureCoordinateBoundaries} from '/tests/fixtures/coordinate-boundary-capture.mjs';
const result={scope:'synthetic real consumer APIs and WebGL framebuffer parity',baselineCommit:snapshot.baselineCommit,numeric:[],framebuffers:[],errors:window.coordinateErrors};
try {
 const renderer=new THREE.WebGLRenderer({antialias:false,preserveDrawingBuffer:true});renderer.setSize(480,320);renderer.setPixelRatio(1);renderer.setClearColor(0x18222d,1);document.body.append(renderer.domElement);
 const gl=renderer.getContext();
 result.webgl=gl.getParameter(gl.VERSION);
 const hash=bytes=>{let h=2166136261;for(const v of bytes){h^=v;h=Math.imul(h,16777619);}return (h>>>0).toString(16).padStart(8,'0');};
 const render=matrix=>{
  const scene=new THREE.Scene();
  const mesh=new THREE.Mesh(new THREE.BoxGeometry(1.3,0.7,0.4),new THREE.MeshNormalMaterial({side:THREE.DoubleSide}));mesh.matrixAutoUpdate=false;mesh.matrix.fromArray(matrix);scene.add(mesh);
  mesh.updateMatrixWorld(true);const box=new THREE.Box3().setFromObject(mesh),center=box.getCenter(new THREE.Vector3()),radius=Math.max(...box.getSize(new THREE.Vector3()).toArray());
  const camera=new THREE.PerspectiveCamera(42,480/320,0.01,10000);camera.position.copy(center).add(new THREE.Vector3(1.7,1.2,2.4).multiplyScalar(radius));camera.lookAt(center);renderer.render(scene,camera);
  const bytes=new Uint8Array(480*320*4);gl.readPixels(0,0,480,320,gl.RGBA,gl.UNSIGNED_BYTE,bytes);
  mesh.geometry.dispose();mesh.material.dispose();return bytes;
 };
 for(const row of snapshot.cases){
  const actual=captureCoordinateBoundaries(row.input);
  const equal=JSON.stringify(actual)===JSON.stringify(row.expected);
  result.numeric.push({id:row.input.id,equal});if(!equal)throw Error('Numeric snapshot drift '+row.input.id);
  const before=render(row.expected.projectileAnchor),after=render(actual.projectileAnchor);
  let maxDifference=0,foregroundPixels=0;
  for(let i=0;i<before.length;i++){maxDifference=Math.max(maxDifference,Math.abs(before[i]-after[i]));if(i%4===0&&(after[i]!==after[0]||after[i+1]!==after[1]||after[i+2]!==after[2]))foregroundPixels++;}
  result.framebuffers.push({id:row.input.id,beforeHash:hash(before),afterHash:hash(after),maxDifference,foregroundPixels});
  if(maxDifference!==0||foregroundPixels<100)throw Error('Framebuffer drift or empty render '+row.input.id);
 }
 renderer.dispose();result.state=window.coordinateErrors.length?'failed':'passed';
}catch(error){result.state='failed';result.errors.push(error.stack||String(error));}
document.querySelector('#results').textContent=JSON.stringify(result);
</script></body></html>
